name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag for the release (e.g., v1.2.3)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "mappls.client.id=${{ secrets.MAPPLS_CLIENT_ID }}" >> local.properties
          echo "mappls.client.secret=${{ secrets.MAPPLS_CLIENT_SECRET }}" >> local.properties
          echo "mappls.map.sdk.key=${{ secrets.MAPPLS_MAP_SDK_KEY }}" >> local.properties
          echo "mappls.rest.api.key=${{ secrets.MAPPLS_REST_API_KEY }}" >> local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing key
        run: |
          echo "${SIGNING_KEY_BASE64}" | base64 -d > signing-key.jks
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}

      - name: Build signed APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=signing-key.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.SIGNING_KEY_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.SIGNING_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.alias.password="${{ secrets.SIGNING_KEY_ALIAS_PASSWORD }}"

      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ github.event.inputs.tag }}
          git push origin ${{ github.event.inputs.tag }}
          
      - name: Wait for tag to propagate
        run: sleep 5
          
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
