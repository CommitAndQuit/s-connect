name: Build and Release APK

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v1
        with:
          java-version: '11'

      - name: Decode and set up signing key
        run: |
          echo ${SIGNING_KEY_BASE64} | base64 --decode > signing-key.jks
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}

      - name: Build signed APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=signing-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.SIGNING_KEY_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.SIGNING_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.alias.password=${{ secrets.SIGNING_KEY_ALIAS_PASSWORD }}

      - name: Upload APK to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: app/build/outputs/apk/release/app-release.apk
          tag: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
