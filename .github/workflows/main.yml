name: Build and Release APK

on:
  push:
    branches:
      - mainline
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag for the release (e.g., v1.2.3). Leave empty for automatic tagging.'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Determine Tag
        id: tagger
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            TAG="v1.0.${GITHUB_SHA::7}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "mappls.client.id=${{ secrets.MAPPLS_CLIENT_ID }}" >> local.properties
          echo "mappls.client.secret=${{ secrets.MAPPLS_CLIENT_SECRET }}" >> local.properties
          echo "mappls.map.sdk.key=${{ secrets.MAPPLS_MAP_SDK_KEY }}" >> local.properties
          echo "mappls.rest.api.key=${{ secrets.MAPPLS_REST_API_KEY }}" >> local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing key
        run: |
          echo "${SIGNING_KEY_BASE64}" | base64 -d > signing-key.jks
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug

      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f ${{ steps.tagger.outputs.tag }}
          git push https://x-access-token:${{ secrets.S_CONENCT_DEBUG }}@github.com/CommitAndQuit/s-connect.git ${{ steps.tagger.outputs.tag }} --force
          
      - name: Wait for tag to propagate
        run: sleep 5
          
      - name: Create GitHub Release via CLI
        run: |
          gh release create ${{ steps.tagger.outputs.tag }} \
            build/outputs/apk/debug/*.apk \
            --title "Debug Release ${{ steps.tagger.outputs.tag }}" \
            --notes "Automated debug build"
        env:
          GITHUB_TOKEN: ${{ secrets.S_CONENCT_DEBUG }}
