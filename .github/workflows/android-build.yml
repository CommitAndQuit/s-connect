# GitHub Actions workflow to build the Android app with Mappls credentials
# ---------------------------------------------------------------
# This workflow creates a temporary `local.properties` file from repository
# secrets before invoking the Gradle build. The file is never committed
# and is discarded after the job finishes.

name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Create local.properties with Mappls secrets
        run: |
          cat <<EOF > local.properties
          mappls.client.id=${{ secrets.MAPPLS_CLIENT_ID }}
          mappls.client.secret=${{ secrets.MAPPLS_CLIENT_SECRET }}
          mappls.map.sdk.key=${{ secrets.MAPPLS_MAP_SDK_KEY }}
          mappls.rest.api.key=${{ secrets.MAPPLS_REST_API_KEY }}
          EOF
        # The file is placed in the project root where Gradle expects it.

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug

      - name: Archive APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
