buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        // Realm Java SDK — required for the realm-android transform plugin
        classpath "io.realm:realm-gradle-plugin:10.18.0"
    }
}

apply plugin: 'com.android.application'
apply plugin: 'realm-android'
Properties properties = new Properties()
if (rootProject.file('local.properties').canRead()) {
    properties.load(new FileInputStream(rootProject.file('local.properties')))
}

android {
    namespace 'com.suzuki.sconnect'
    compileSdk 34

    defaultConfig {
        applicationId "com.suzuki.sconnect"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0-debug"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "MAPPLS_CLIENT_ID", "\"${properties.getProperty('mappls.client.id')}\""
        buildConfigField "String", "MAPPLS_CLIENT_SECRET", "\"${properties.getProperty('mappls.client.secret')}\""
        buildConfigField "String", "MAPPLS_MAP_SDK_KEY", "\"${properties.getProperty('mappls.map.sdk.key')}\""
        buildConfigField "String", "MAPPLS_REST_API_KEY", "\"${properties.getProperty('mappls.rest.api.key')}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file("dummy.keystore")
            storePassword "dummypass"
            keyAlias "dummy"
            keyPassword "dummypass"
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    dataBinding {
        enabled = true
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'

    // Mappls SDK
    implementation('com.mappls.sdk:mappls-android-sdk:8.1.3') {
        exclude group: 'androidx.lifecycle', module: 'lifecycle-viewmodel-desktop'
    }
    implementation('com.mappls.sdk:place-widget:2.0.0') {
        exclude group: 'androidx.lifecycle', module: 'lifecycle-viewmodel-desktop'
    }
    implementation('com.mappls.sdk:direction-ui:2.0.0') {
        exclude group: 'androidx.lifecycle', module: 'lifecycle-viewmodel-desktop'
    }

    // MPAndroidChart for Fuel Economy Charts (P5)
    implementation 'com.github.PhilJay:MPAndroidChart:3.1.0'

    // WorkManager for Periodic Service Reminders (P7)
    implementation "androidx.work:work-runtime:2.9.0"
}
android {
    lint {
        abortOnError false
    }
}
