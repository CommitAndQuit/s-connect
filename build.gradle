plugins {
    id 'com.android.application'
}

android {
    namespace 'com.suzuki.sconnect'
    compileSdk 34

    defaultConfig {
        applicationId "com.suzuki.sconnect"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0-debug"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    dataBinding {
        enabled = true
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Mappls SDK
    implementation('com.mappls.sdk:mappls-android-sdk:8.1.3') {
        exclude group: 'androidx.lifecycle', module: 'lifecycle-viewmodel-desktop'
    }
    implementation('com.mappls.sdk:place-widget:2.0.0') {
        exclude group: 'androidx.lifecycle', module: 'lifecycle-viewmodel-desktop'
    }
    implementation('com.mappls.sdk:direction-ui:2.0.0') {
        exclude group: 'androidx.lifecycle', module: 'lifecycle-viewmodel-desktop'
    }
}
